# Workers deployment target for the tektone.com.br/hub + /task migration
# (see plan: unify marketing/hub/crm/portal under tektone.com.br path routing).
# Deliberately a SEPARATE config from wrangler.toml (the live Pages project,
# still serving tasks.tektone.com.br unchanged via `npm run deploy`) so this
# migration is purely additive — nothing about the existing Pages deploy
# pipeline changes until we're ready to formally cut over.
#
# Build before deploying:
#   npm run build && npx wrangler pages functions build --outdir=./dist/_worker.js/
# Deploy:
#   npx wrangler deploy --config wrangler.worker.toml

name = "tektone-hub"
main = "./worker/hub-entry.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "193882a3226d5fb9c3611ea50c95992e"

routes = [
  { pattern = "tektone.com.br/hub/*", zone_name = "tektone.com.br" },
  { pattern = "tektone.com.br/task/*", zone_name = "tektone.com.br" },
]

[assets]
directory = "./dist"
binding = "ASSETS"
# SPA fallback — this app has no real URL-based routing (App.jsx branches by
# React state, not paths), so any non-file request under /hub/* or /task/*
# must resolve to index.html for the client bundle to boot. Mirrors Pages'
# implicit default SPA fallback (no _redirects file exists in this repo
# today because Pages does this automatically; Workers assets requires it
# explicit).
not_found_handling = "single-page-application"
# Every request (assets included, not just /api/*) must go through
# worker/hub-entry.js first to strip the /hub or /task prefix — the compiled
# Pages Functions handler's own internal asset fallback expects root-relative
# paths matching the physical dist/ layout (e.g. "/assets/...", not
# "/hub/assets/..."), same as vite's `base: "/hub/"` setting.
run_worker_first = true

# Same bindings as wrangler.toml (identical KV/D1 — this Worker reads/writes
# the SAME production data as the Pages deployment; both can run in parallel
# safely since it's the same underlying D1/KV, not a copy).
[[kv_namespaces]]
binding = "KANBAN"
id = "b06af75d5fe74e4c83863bf6a36030d0"

[[d1_databases]]
binding = "DB"
database_name = "hub-tektone"
database_id = "062719db-dc4e-46c0-a9d9-bdb4fef61a30"

[vars]
TASKS_BACKEND = "d1"
# See wrangler.toml for why this is needed — Resend only has
# send.tektone.com.br verified, not the bare domain the code fell back to.
NOTIFY_FROM = "TEKTONE <notificacoes@send.tektone.com.br>"

[[durable_objects.bindings]]
name = "BOARD_ROOM"
class_name = "BoardRoom"
script_name = "tektone-realtime"
