# Workers deployment target for the tektone.com.br/crm CRM (see plan:
# ~/.claude/plans/wise-riding-wirth.md, "Phase 5: Build /crm core"). New
# Hono-based routes for leads/sales/commissions; auth + static assets
# delegate to the same compiled backend as tektone-hub/tektone-portal (see
# worker/crm-entry.js).
#
# Build before deploying:
#   npm run build && npm run build:crm && npx wrangler pages functions build --outdir=./dist/_worker.js/
# Deploy:
#   npx wrangler deploy --config wrangler.crm.toml

name = "tektone-crm"
main = "./worker/crm-entry.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "193882a3226d5fb9c3611ea50c95992e"

routes = [
  # See wrangler.worker.toml's comment — "/crm/*" alone doesn't match a bare
  # "/crm" with no trailing slash.
  { pattern = "tektone.com.br/crm", zone_name = "tektone.com.br" },
  { pattern = "tektone.com.br/crm/*", zone_name = "tektone.com.br" },
]

[assets]
directory = "./dist-crm"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[kv_namespaces]]
binding = "KANBAN"
id = "b06af75d5fe74e4c83863bf6a36030d0"

[[d1_databases]]
binding = "DB"
database_name = "hub-tektone"
database_id = "062719db-dc4e-46c0-a9d9-bdb4fef61a30"

[vars]
TASKS_BACKEND = "d1"

[[durable_objects.bindings]]
name = "BOARD_ROOM"
class_name = "BoardRoom"
script_name = "tektone-realtime"
