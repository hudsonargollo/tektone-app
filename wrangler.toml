name = "tektone-app"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"
# Required by @block65/webcrypto-web-push (Phase B web push): it has a
# `node:crypto` fallback import for non-Workers runtimes that's never
# actually reached here (globalThis.crypto is always present in Workers),
# but the bundler still needs this flag to resolve it without warning/erroring.
compatibility_flags = ["nodejs_compat"]

# KV binding for the kanban API (Pages Functions read env.KANBAN).
# id is filled in after `wrangler kv namespace create KANBAN`.
[[kv_namespaces]]
binding = "KANBAN"
id = "b06af75d5fe74e4c83863bf6a36030d0"

# Durable Object binding for realtime board broadcasts (confetti on card
# review). The class itself lives in the separate `realtime-worker/` Worker —
# Pages Functions can't define Durable Objects, only consume one. Deploy that
# Worker (`cd realtime-worker && npm run deploy`) before deploying this Pages
# project, or the binding won't resolve.
[[durable_objects.bindings]]
name = "BOARD_ROOM"
class_name = "BoardRoom"
script_name = "tektone-realtime"
